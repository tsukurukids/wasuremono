<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘れ物チェッカー😊</title>
    <!-- UDフォントを読みこむよ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (色ぬり) -->
    <script src="tailwindcss.js"></script>
    <!-- React & ReactDOM (動かす部品) -->
    <script src="react.js"></script>
    <script src="react-dom.js"></script>
    <!-- Lucide アイコン (React専用の道具箱に変更！) -->
    <script src="lucide.js"></script>
    <!-- お化粧の本 (CSS) -->
    <link rel="stylesheet" href="style.css">
    <!-- PWAの設計図 (manifest.json) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f472b6">
    <link rel="apple-touch-icon" href="icon.svg">
</head>
<body class="bg-gray-50">
    <!-- ここにアプリが映し出されるよ。最初は魔法の文字を出しておくね -->
    <div id="root" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; font-size: 20px; font-weight: bold; color: #f472b6; font-family: sans-serif;">
        魔法をかけてるよ... 🪄 (Ver.1.3)
    </div>

    <!-- 魔法のメインプログラム (JS) -->
    <script src="script2.js"></script>

    <!-- ロボット（サービスワーカー）を呼び出す魔法 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then((registration) => {
              console.log('ロボットの準備ができたよ！', registration.scope);
            })
            .catch((error) => {
              console.log('ロボットの準備に失敗しちゃった...', error);
            });
        });
      }
    </script>
</body>
</html>
